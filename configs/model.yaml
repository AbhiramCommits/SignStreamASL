# Model and training configuration. CPU-friendly by design.
seed: 7
seq_len: 48
feature_dim: 183
num_classes: 60
d_model: 128
nhead: 4
num_layers: 4
ffn_dim: 256
dropout: 0.1
batch_size: 256
epochs: 12
learning_rate: 0.001
weight_decay: 0.01
