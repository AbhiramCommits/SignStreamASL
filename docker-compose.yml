services:
  signstream:
    build: .
    image: signstream:local
    ports:
      - "8000:8000"
    environment:
      SIGNSTREAM_BACKEND: torch
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
