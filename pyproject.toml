[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signstream"
version = "0.1.0"
description = "End-to-end American Sign Language recognition: capture, curation, training, fairness, decoding, and serving."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "SignStreamASL contributors" }]
dependencies = [
  "numpy>=1.26,<2",
  "PyYAML>=6.0",
  "torch>=2.2,<3",
  "scikit-learn>=1.3,<2",
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "python-multipart>=0.0.9",
  "httpx>=0.26,<1",
  "onnx>=1.15,<1.18",
  "onnxruntime>=1.17,<2",
  "mlflow>=2.10,<4",
]

[project.optional-dependencies]
capture = ["mediapipe>=0.10,<0.11", "opencv-python>=4.8,<5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
signstream = "signstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: heavier end-to-end tests",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/signstream"]
omit = ["src/signstream/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
